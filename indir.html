<h1>Hadi Bil’i indir</h1>
<div class="kart"><p>Bilgi yarışması: düellolar, ligler, sınav soruları. Ücretsiz.</p>
<p id="davet" class="not" hidden></p>
<p style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px">
<a id="play" href="https://play.google.com/store/apps/details?id=app.hadibil" style="padding:12px 18px;border-radius:12px;background:#16123A;color:#fff;text-decoration:none;font-weight:700">Google Play’den indir</a>
<a id="ios" href="#" style="padding:12px 18px;border-radius:12px;background:#5B3DF5;color:#fff;text-decoration:none;font-weight:700">iPhone · yakında</a>
</p></div>
<script>
(function () {
  var PLAY = "https://play.google.com/store/apps/details?id=app.hadibil", IOS = "";
  var k = ''; try { k = (new URLSearchParams(location.search).get('davet') || '').toLowerCase(); } catch (e) {}
  if (!/^[a-z0-9._]{3,15}$/.test(k)) k = '';
  var play = k ? PLAY + '&referrer=' + encodeURIComponent('davet=' + k) : PLAY;
  document.getElementById('play').href = play;
  var ua = navigator.userAgent || '', ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  if (k) { var d = document.getElementById('davet'); d.hidden = false; d.textContent = 'Davet eden: ' + k + (ios ? ' · uygulamayı kurunca Arkadaşlar ekranındaki “Seni biri mi davet etti?” bölümüne bu adı yaz.' : ''); }
  if (!IOS) { var b = document.getElementById('ios'); b.removeAttribute('href'); b.style.opacity = '0.6'; }
  if (/Android/i.test(ua)) location.replace(play);
  else if (ios && IOS) location.replace(IOS);
})();
</script>
<p class="not">Sürüm 1.7 · Son güncelleme: 6 Kasım 2026</p>
